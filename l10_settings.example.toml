# l10ctl 设置文件示例。复制成 l10_settings.toml，只留下要改的行。
#
# 放在哪（只用找到的第一个）：
#   1. 环境变量 L10_SETTINGS 指定的文件
#   2. 运行命令时的当前目录
#   3. 数据目录（打包的 exe：exe 旁边）
# 看实际用的是哪个、改了哪些项：python -m l10ctl.settings
#
# 名字和默认值都在 l10ctl/config.py（那里有每一项的说明）。名字写错、类型不对会直接报错。
# 关节顺序（10 个值，原始值 0~255）：
#   拇指弯曲 拇指翻滚 食指 中指 无名指 小指 食指侧摆 无名指侧摆 小指侧摆 拇指旋转

# ---------------------------------------------------------------- 连接
SIDE = "left"               # "left" | "right"
INTERFACE = "pcan"          # "pcan"（Windows + PEAK 适配器）| "socketcan"（Linux）| "auto"（自动发现）
CHANNEL = "PCAN_USBBUS1"    # pcan：PCAN_USBBUS1；socketcan：can0
# BITRATE = 1000000

# 指尖力从哪读："fns"（每指汇总值）| "fn_max"（12×6 触觉点阵每指最大值）| "auto"（先 fns，读不到再 fn_max）
# 不确定就运行 examples/01_check_connection.py，它会把两种都读一次。
# FORCE_SOURCE = "fn_max"

# ---------------------------------------------------------------- 速度（10 个关节，越大越快）
# MOVE_SPEED = [100, 100, 100, 100, 100, 100, 100, 100, 100, 100]
# JOG_SPEED = [60, 60, 60, 60, 60, 60, 60, 60, 60, 60]

# ---------------------------------------------------------------- 摄像头镜像 / 游戏
# MIRROR_CAMERA_INDEX = 1   # 外接 USB 摄像头一般是 1
# MIRROR_DEADBAND = 6       # 防抖：越大越稳，细小动作跟得越少（网页上可以实时调）
# MIRROR_SPEED = [150, 150, 150, 150, 150, 150, 150, 150, 150, 150]
# MIRROR_FONT = "/usr/share/fonts/truetype/wqy/wqy-microhei.ttc"   # l10-mirror 窗口找不到中文字体时

# ---------------------------------------------------------------- 握手
# HANDSHAKE_GRIP_FORCE = 25
# HANDSHAKE_USE_THUMB = true
# HANDSHAKE_POSE = [192, 77, 165, 132, 114, 84, 128, 128, 128, 128]

# ---------------------------------------------------------------- 表（放在最后；只写要改的项，其余保持默认）
# 预设姿态（examples/04_joint_jog.py 输入 s 会打印成这种写法）
# [POSES]
# open = [255, 255, 255, 255, 255, 255, 128, 67, 89, 255]

# 网页控制台预设的真机调整值（覆盖同名的官方预设，数字动画也用）
# [USER_OVERRIDES]
# num7 = [159, 137, 130, 109, 0, 0, 255, 200, 199, 152]

# 抓取物体（examples/03、05 用）
# [OBJECTS.cup]
# target = [110, 20, 80, 80, 80, 80, 128, 67, 89, 197]
# target_force = 15
